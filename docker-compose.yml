services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - backend
    restart: always

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8000"
    volumes:
      - ./backend:/app:Z
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "3000"
    volumes:
      - ./frontend:/app:Z
    stdin_open: true
    tty: true

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
